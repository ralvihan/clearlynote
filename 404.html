<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#6E1A37">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.png" type="image/png" sizes="192x192">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Halaman tidak ditemukan - Clearlynote</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:grid;place-items:center;padding:20px;background:#F5F6F7;color:#17181A;font-family:Inter,system-ui,sans-serif;line-height:1.5}
.card{width:100%;max-width:420px;background:#fff;border:1px solid #E4E7EB;border-radius:22px 22px 22px 8px;padding:32px 28px;text-align:center;box-shadow:0 10px 36px rgba(17,18,20,.06)}
.logo{display:block;margin:0 auto 14px}
.mark{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50% 50% 50% 8px;background:#6E1A37;color:#fff;font-weight:700;font-size:22px;margin-bottom:18px}
.code{font-size:64px;font-weight:800;letter-spacing:-.04em;line-height:1;color:#6E1A37}
h1{font-size:20px;font-weight:700;margin:12px 0 6px;letter-spacing:-.02em}
p{color:#626A76;font-size:14px;margin-bottom:22px}
a{display:inline-block;background:#6E1A37;color:#fff;text-decoration:none;font-weight:600;font-size:13.5px;padding:9px 18px;border-radius:999px}
a:hover{background:#3F0E20}
a:focus-visible{outline:3px solid #C58B2B;outline-offset:2px}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="/logo_clearlynote.svg" alt="" width="56" height="56">
  <div class="code">404</div>
  <h1>Halaman tidak ditemukan</h1>
  <p>Alamat yang kamu buka tidak ada atau sudah dipindah. Balik ke catatan hutangmu aja.</p>
  <a href="/">Kembali ke Clearlynote</a>
</main>
</body>
</html>
